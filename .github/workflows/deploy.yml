name: Refresh and deploy knowledge graph
on:
  push:
    branches: [main, master]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [physlib-updated]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      physlib_sha: ${{ steps.provenance.outputs.physlib_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/physlib
          ref: master
          path: .physlib-source
          fetch-depth: 0
      - name: Record Physlib revision
        id: provenance
        run: echo "physlib_sha=$(git -C .physlib-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run validate:assets
      - run: npm run build:city
      - run: npm run build:data
      - run: npm run validate:data
      - run: node scripts/city-v2-inventory.mjs .physlib-source
      - run: node scripts/validate-declarations.mjs site/data/graph.json site/data/declarations.json
      - name: Validate Geneva startup using the real deployment snapshot
        run: node scripts/validate-city-v2-startup.mjs
      - name: Validate G1 terrain and capacity against actual snapshot
        run: node scripts/validate-geneva-g1.mjs
      - name: Build and validate source-linked Geneva city
        run: node scripts/build-geneva-production.mjs --require-inventory
      - name: Build revision-pinned source activity and review evidence
        run: node scripts/build-geneva-evidence.mjs .physlib-source
      - name: Generate sampled history (optional companion)
        run: |
          node scripts/build-geneva-history.mjs .physlib-source || { rm -f site/data/geneva-history.json; echo '::warning::History unavailable; publishing current city only'; }
      - name: Read Mathlib revision pinned by Physlib
        id: mathlib_pin
        run: echo "revision=$(node scripts/mathlib-pin.mjs .physlib-source)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Mathlib
        uses: actions/checkout@v4
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ steps.mathlib_pin.outputs.revision }}
          path: .physlib-source/.lake/packages/mathlib
      - run: npm run build:mathlib
      - run: npm run package:site
      - name: Install browser smoke test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify packaged production city in Chromium
        run: node scripts/smoke-geneva-browser.mjs
        timeout-minutes: 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geneva-browser-evidence
          path: dist/browser-evidence/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check revisions before publication
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUILT_PHYSLIB_SHA: ${{ needs.build.outputs.physlib_sha }}
        run: |
          set -eu
          graph_head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${DEFAULT_BRANCH}" | cut -f1)
          physlib_head=$(git ls-remote https://github.com/leanprover-community/physlib.git refs/heads/master | cut -f1)
          if [ "$graph_head" != "$GITHUB_SHA" ] || [ "$physlib_head" != "$BUILT_PHYSLIB_SHA" ]; then
            echo 'A source branch advanced since this build started; the existing site remains published.' >&2
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
