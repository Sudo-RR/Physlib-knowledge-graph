name: Refresh and deploy knowledge graph
on:
  push:
    branches: [main, master]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [physlib-updated]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      physlib_sha: ${{ steps.provenance.outputs.physlib_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/physlib
          ref: master
          path: .physlib-source
      - uses: actions/checkout@v4
        with:
          repository: jjeffrey/lean-vouch
          ref: b235856d959bdd7c20df734af35d8bad579d6a4c
          path: .reference-lean-vouch
      - name: Record Physlib revision
        id: provenance
        run: echo "physlib_sha=$(git -C .physlib-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build:data
      - run: npm run validate:data
      # The declaration pilot is optional: a failed extraction publishes the
      # fresh module graph and an explicit failure state, never stale declarations.
      - name: Prepare Lean for declaration pilot
        id: prepare_lean
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .physlib-source
          auto-config: false
          use-mathlib-cache: true
      - name: Generate declaration pilot
        id: declaration_pilot
        if: steps.prepare_lean.outcome == 'success'
        continue-on-error: true
        run: >-
          node scripts/run-lean-vouch.mjs
          .physlib-source site/data/graph.json .reference-lean-vouch site/data/declarations.json
          Physlib.ClassicalMechanics.EulerLagrange
          Physlib.ClassicalMechanics.HarmonicOscillator.Basic
          Physlib.ClassicalMechanics.Pendulum.SimplePendulum.Basic
      - name: Record declaration refresh status
        env:
          PREPARE_OUTCOME: ${{ steps.prepare_lean.outcome }}
          PILOT_OUTCOME: ${{ steps.declaration_pilot.outcome }}
        run: node scripts/write-declaration-status.mjs
      - name: Validate declaration pilot if available
        if: steps.declaration_pilot.outcome == 'success'
        run: node scripts/validate-declarations.mjs site/data/graph.json site/data/declarations.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check revisions before publication
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUILT_PHYSLIB_SHA: ${{ needs.build.outputs.physlib_sha }}
        run: |
          set -eu
          graph_head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${DEFAULT_BRANCH}" | cut -f1)
          physlib_head=$(git ls-remote https://github.com/leanprover-community/physlib.git refs/heads/master | cut -f1)
          if [ "$graph_head" != "$GITHUB_SHA" ] || [ "$physlib_head" != "$BUILT_PHYSLIB_SHA" ]; then
            echo 'A source branch advanced since this build started; the existing site remains published.' >&2
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
