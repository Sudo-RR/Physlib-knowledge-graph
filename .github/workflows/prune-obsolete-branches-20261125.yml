name: One-time audited obsolete branch cleanup
on:
  push:
    branches: [master]
    paths:
      - '.github/maintenance/obsolete-branches-20261125.tsv'
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: audited-branch-cleanup-20261125
  cancel-in-progress: false
jobs:
  prune:
    if: github.repository == 'Sudo-RR/Physlib-knowledge-graph' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and prune only exact audited branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.repository.default_branch' "$GITHUB_EVENT_PATH")" = master
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          manifest=.github/maintenance/obsolete-branches-20261125.tsv
          # Preflight the exact allowlist before any destructive operation.
          mapfile -t records < "$manifest"
          test "${#records[@]}" -eq 12
          for record in "${records[@]}"; do
            IFS=$'\t' read -r branch expected mode <<< "$record"
            case "$branch" in codex/*|feature/city-v2-*) ;; *) echo "Refused branch $branch"; exit 1;; esac
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
            [[ "$mode" == merged || "$mode" == archive ]]
            git check-ref-format "refs/heads/$branch"
            ref="refs/heads/$branch"
            actual=$(git ls-remote --heads origin "$ref" | cut -f1)
            if [[ -z "$actual" ]]; then
              echo "Already absent: $branch"; continue
            fi
            test "$actual" = "$expected"
            git cat-file -e "$expected^{commit}"
            if [[ "$mode" == merged ]]; then git merge-base --is-ancestor "$expected" refs/remotes/origin/master; fi
            prs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[] | .head.ref, .base.ref')
            if grep -Fxq "$branch" <<< "$prs"; then echo "Open PR refers to $branch"; exit 1; fi
          done
          # Preserve every divergent tip by a non-overwriting archive tag before branch deletion.
          for record in "${records[@]}"; do
            IFS=$'\t' read -r branch expected mode <<< "$record"
            ref="refs/heads/$branch"
            actual=$(git ls-remote --heads origin "$ref" | cut -f1)
            [[ -n "$actual" ]] || continue
            test "$actual" = "$expected"
            prs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[] | .head.ref, .base.ref')
            if grep -Fxq "$branch" <<< "$prs"; then echo "Open PR refers to $branch"; exit 1; fi
            if [[ "$mode" == archive ]]; then
              tag="refs/tags/archive/2026-11-25/$branch"
              archived=$(git ls-remote origin "$tag" | cut -f1)
              if [[ -z "$archived" ]]; then
                git push origin "$expected:$tag"
              else
                test "$archived" = "$expected"
              fi
              test "$(git ls-remote origin "$tag" | cut -f1)" = "$expected"
              echo "Archived $branch at $expected as $tag"
            else
              git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
              git merge-base --is-ancestor "$expected" refs/remotes/origin/master
            fi
            git push --force-with-lease="$ref:$expected" origin ":$ref"
            test -z "$(git ls-remote --heads origin "$ref")"
            echo "Deleted $branch"
          done
          git ls-remote --heads origin
