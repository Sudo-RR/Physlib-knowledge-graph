name: Elaborated declaration pilot
on:
  push:
    branches: [master, main]
    paths:
      - 'scripts/elaborated-pilot.mjs'
      - 'scripts/run-elaborated-pilot.mjs'
      - 'scripts/native-lean-metadata.lean'
      - 'scripts/pack-native-metadata.mjs'
      - 'test/native-metadata-shards.test.mjs'
      - 'test/elaborated-pilot.test.mjs'
      - '.github/workflows/elaborated-pilot.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * *'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: pilot
            revision: 85bb8f5df598f6701be57a70f06e08069e30589c
          - scope: full
            revision: master
    env:
      LAKE_CACHE_DIR: .lake/cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/elaborated-pilot.test.mjs
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/physlib
          ref: ${{ matrix.revision }}
          path: .pilot-physlib
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PierreSenellart/result-graph
          ref: 2ee55ff6e521eabe71ecddac797e12f64448a5b6
          path: .pilot-result-graph
          persist-credentials: false
      - name: Install matching Lean
        working-directory: .pilot-physlib
        run: |
          set -o pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Restore Mathlib cache
        working-directory: .pilot-physlib
        run: lake exe cache get
      - name: Restore Physlib cache (optional)
        working-directory: .pilot-physlib
        env:
          LAKE_CONFIG: ${{ github.workspace }}/.pilot-physlib/lake-cache.toml
        run: lake cache get --scope="physlib-master/$(tr '/:' '--' < lean-toolchain | tr -d '[:space:]')/physlib" || echo "Cache unavailable; build selected roots"
      - name: Build and extract selected roots
        run: node scripts/run-elaborated-pilot.mjs .pilot-physlib .pilot-result-graph pilot-evidence ${{ matrix.scope }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elaborated-${{ matrix.scope }}-evidence
          path: pilot-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Export full native Lean declaration metadata
        id: native
        if: matrix.scope == 'full'
        continue-on-error: true
        timeout-minutes: 55
        working-directory: .pilot-physlib
        run: |
          set -eu
          mkdir -p ../native-evidence
          /usr/bin/time -v -o ../native-evidence/native.time.txt lake env lean --run ../scripts/native-lean-metadata.lean ../pilot-evidence/snapshot.json ../native-evidence/native.jsonl --jsonl Physlib PhyslibAlpha QuantumInfo
          git diff --exit-code
          cp ../pilot-evidence/provenance.json ../native-evidence/provenance.json
          (cd ../native-evidence && sha256sum native.jsonl > native.sha256)
      - name: Validate full native metadata before publication artifact
        id: validate_native
        if: matrix.scope == 'full' && steps.native.outcome == 'success'
        continue-on-error: true
        run: node scripts/pack-native-metadata.mjs validate pilot-evidence/snapshot.json native-evidence
      - uses: actions/upload-artifact@v4
        if: matrix.scope == 'full' && steps.native.outcome == 'success' && steps.validate_native.outcome == 'success'
        with:
          name: native-full-evidence
          path: native-evidence/
          retention-days: 14
      - name: Report optional native metadata status
        if: matrix.scope == 'full' && (steps.native.outcome != 'success' || steps.validate_native.outcome != 'success')
        run: echo '::warning::Native full metadata unavailable; validated result-graph extraction remains usable.'
